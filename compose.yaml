# 실행:  docker compose up -d --build
# 중지:  docker compose down        (데이터는 class-share-data 볼륨에 남습니다)

services:
  class-share:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 수업방을 만들 때 물어볼 비밀번호. 인터넷에 공개한다면 꼭 바꿔서 쓰세요. (지우면 누구나 만들 수 있음)
      TEACHER_PASSWORD: "여기에-비밀번호"
      # 학생에게 보여 줄 주소. 도메인이 있으면 그 주소를, 교실 안에서만 쓰면 이 컴퓨터의 IP 주소를 적습니다.
      # PUBLIC_URL: "https://share.example.com"
      # PUBLIC_URL: "http://192.168.0.10:3000"
      # nginx·Caddy 같은 프록시 뒤에 둘 때는 1
      # TRUST_PROXY: "1"
      # MAX_FILE_MB: "100"
      # MAX_ROOM_MB: "500"
      # ROOM_TTL_DAYS: "30"
    volumes:
      - class-share-data:/data

volumes:
  class-share-data:
